[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-agent"
version = "0"
description = "Decentralized agent workflows backed by Beads and Tollgate"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["black==26.5.1", "pyre-check==0.10.0", "ruff==0.16.8", "setuptools==80.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN401"]
